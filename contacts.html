<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Контакты</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <div class="container-fluid">
    <div class="row min-vh-100">

      <!-- Sidebar -->
      <aside class="col-12 col-md-3 col-lg-2 bg-dark text-white p-3">
        <h5 class="mb-3">Меню</h5>
        <nav class="nav flex-column">
          <a class="nav-link text-white" href="index.html">Главная</a>
          <a class="nav-link text-white" href="catalog.html">Каталог</a>
          <a class="nav-link text-white" href="category.html">Категория</a>
          <a class="nav-link text-white active" href="contacts.html">Контакты</a>
        </nav>
      </aside>

      <!-- Main -->
      <main class="col-12 col-md-9 col-lg-10 p-4">
        <h1 class="mb-4">Контакты</h1>
        <p class="text-muted">
  Оставьте сообщение — мы свяжемся с вами.
</p>

<form class="mt-4" action="#" method="post">
  <div class="mb-3">
    <label for="name" class="form-label">Имя</label>
    <input
      type="text"
      class="form-control"
      id="name"
      name="name"
      placeholder="Введите ваше имя"
      required
    />
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="name@example.com"
      required
    />
  </div>

  <div class="mb-3">
    <label for="message" class="form-label">Сообщение</label>
    <textarea
      class="form-control"
      id="message"
      name="message"
      rows="5"
      placeholder="Введите текст сообщения"
      required
    ></textarea>
  </div>

  <button type="submit" class="btn btn-primary">Отправить</button>
</form>


      </main>

    </div>
  </div>
</body>
</html>
